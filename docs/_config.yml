title: GRIP
description: >-
  GRIP — Generic Reverse Interconnect Proxy. Secure external access to HTTP
  services inside a private network, with no inbound firewall rule.
url: https://johnjoeallen.github.io
baseurl: /grip

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# just-the-docs renders fenced ```mermaid blocks when this is set.
mermaid:
  version: "10.9.1"

aux_links:
  GitHub: https://github.com/johnjoeallen/grip
aux_links_new_tab: true

heading_anchors: true
color_scheme: light

# Pages that are only linked, not built into nav ordering.
exclude:
  - backlog/
  - Gemfile
  - Gemfile.lock
  - vendor/
